services:
  lemmy-rss-pybot:
    build: .
    container_name: lemmy-rss-pybot
    volumes:
      - ./data:/app/data
      - ./rss_feeds.json:/app/rss_feeds.json:ro
    environment:
      - LEMMY_USERNAME=${LEMMY_USERNAME}
      - LEMMY_PASSWORD=${LEMMY_PASSWORD}
      - LEMMY_INSTANCE_URL=${LEMMY_INSTANCE_URL}
    restart: unless-stopped
    entrypoint: >
      sh -c "test -f /app/rss_feeds.json || (echo 'rss_feeds.json not found' && exit 1); 
      python lemmy-rss-pybot.py --feeds /app/rss_feeds.json --log /app/data/lemmy_bot.log --interval 15 --max_posts 1"
